title: "JUnit 5 Gradle Compatibility Spec"
intro: >
  Living documentation generated by tabletest-reporter from the JUnit 5 Gradle
  compatibility project. Exercises spec-level metadata: a real title and intro
  replacing the leaked package name, a retitled intermediate page, and an
  explicit feature reading order.
features:
  - name: subpackage
    title: "Subpackage Feature"
  - name: multiple-tabletests
    title: "Multiple TableTests"
publish:
  exclude:
    - multiple-tabletests               # the class page and all three of its tables
    - nested-test-classes/inner-tests   # a nested feature page, taking its table with it
  include:
    - multiple-tabletests/addition      # re-admitted, though its class page is excluded
