# Report-time curation for the reporter's own self-hosted spec.
#
# Spec metadata (title, intro, feature titles) and publish selection are both applied when
# the report is generated, not when the tests run. Nothing here is a test-code concern, and
# nothing here is JVM-specific — the second (non-JVM) implementation ships the same file.
# See products/reporter/decisions/spec-metadata-sidecar-file.md and
# products/reporter/decisions/publish-selection-at-report-time.md.

# --- Spec metadata --------------------------------------------------------------------
# Without this section the root index is titled by the deepest common package segment
# ("reporter") and each group page by its lowercase package name. The groups are listed in the
# order the reporter works in — the report, then a page of it, then a table on that page, then
# the format it is all written in — rather than alphabetically.
title: "TableTest Reporter"
intro: >
  How TableTest results become a published specification: what each page contains, how a table
  and its results are rendered, and what the reporter's options do. Every rule below is
  executable — it is a test that runs in CI, and each scenario is one row of that test's table.
  This spec is generated by the tool it documents.
features:
  - name: structure
    title: "Report structure"
    description: >
      The shape of the published report: which pages exist, what each one is called, where the
      tree is rooted, and how deep the indexes go. The same in every format.
    features:                # the tree, then what its pages are called, then how much of it
      - name: the-page-tree  # gets an index page of its own
      - name: page-names
      - name: the-indexdepth-option
  - name: pages
    title: "Page contents"
    description: >
      What one page carries besides its table. Markdown and AsciiDoc pages carry the title,
      description and table alone — breadcrumbs, the sidebar and the footer are the HTML
      report's navigation, and the rules below say so where it matters.
  - name: tables
    title: "Table rendering"
    description: >
      How a table's cells, column roles and row verdicts reach the page. A mark needs somewhere
      to live, so these rules carry a column per format rather than one rule per format.
  - name: formats
    title: "Formats and templates"
    description: >
      Choosing the format a report is written in, defining one of your own, and replacing or
      extending the templates that render it.

# --- Site link ------------------------------------------------------------------------
# The spec is published under tabletest.org/spec/reporter, where every link inside the report
# is relative to the report's own tree. This is the one link back out to the site.
site:
  label: "TableTest"
  url: "https://tabletest.org/"

# --- Publish selection ----------------------------------------------------------------
publish:
  exclude:
    - input-directory-resolver-test      # resolving configured input directories
    - test-output-file-finder-test       # locating a module's TableTest YAML output
    - json-test                          # JSON (de)serialisation internals
    - junit-dir-parser-test              # parsing a JUnit output directory
    - junit-properties-reader-test       # reading junit-platform.properties
    - report-configuration-resolver-test # merging config from file, options and defaults
    - target-path-resolver-test          # mapping a page to its on-disk output path
    - status-rollup-test                 # the counting behind a page's verdict
    - publish-pattern-match-test         # glob matching behind this very exclude list
    - publish-selection-apply-test       # applying the exclude/include tree transform
    - spec-metadata-apply-test           # applying title/intro/order onto the tree
    - pebble                             # Pebble template filter internals (whole subtree)

    # --- From tabletest-reporter-junit, merged in by <inputDirectories> ---
    # The extension's own test package, held back whole: the two slug tiers below Slugger, the
    # role-token rules, the @Lines converter and the row-result matcher. Each is either an
    # internal mechanism or a rule on a package-private class, which cannot leave this package
    # and so could not join a subject group. A rule that belongs in the spec moves out of the
    # package instead — as the naming rules did, into structure/page-names.
    - junit
