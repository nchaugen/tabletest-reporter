# Report-time curation for the reporter's own self-hosted spec.
#
# Spec metadata (title, intro, feature titles) and publish selection are both applied when
# the report is generated, not when the tests run. Nothing here is a test-code concern, and
# nothing here is JVM-specific — the second (non-JVM) implementation ships the same file.
# See products/reporter/decisions/spec-metadata-sidecar-file.md and
# products/reporter/decisions/publish-selection-at-report-time.md.

# --- Spec metadata --------------------------------------------------------------------
# Without this section the root index is titled by the deepest common package segment
# ("reporter") and the rendering feature page by its lowercase package name. Rendering leads
# because it is the reporter's defining behaviour; the option rules follow alphabetically.
title: "TableTest Reporter — Specification"
intro: >
  How TableTest results become a published specification: what each page contains, how a table
  and its results are rendered, and what the reporter's options do. Every rule below is
  executable — it is a test that runs in CI, and each scenario is one row of that test's table.
  This spec is generated by the tool it documents.
features:
  - name: rendering
    title: "Report rendering"

# --- Publish selection ----------------------------------------------------------------
publish:
  exclude:
    - input-directory-resolver-test      # resolving configured input directories
    - test-output-file-finder-test       # locating a module's TableTest YAML output
    - json-test                          # JSON (de)serialisation internals
    - junit-dir-parser-test              # parsing a JUnit output directory
    - junit-properties-reader-test       # reading junit-platform.properties
    - report-configuration-resolver-test # merging config from file, options and defaults
    - target-path-resolver-test          # mapping a page to its on-disk output path
    - publish-pattern-match-test         # glob matching behind this very exclude list
    - publish-selection-apply-test       # applying the exclude/include tree transform
    - spec-metadata-apply-test           # applying title/intro/order onto the tree
    - pebble                             # Pebble template filter internals (whole subtree)
